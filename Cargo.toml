[package]
name = "autox"
version = "0.1.0"
edition = "2021"
description = "Fast X (Twitter) API v2 posting library + CLI for AutoX / @TheBlackNull"
license = "MIT"
readme = "README.md"
default-run = "autox-post"

[[bin]]
name = "autox-post"
path = "src/bin/autox_post.rs"

[dependencies]
# Async runtime — lean feature set
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }

# Direct X HTTP — rustls only; one Client reused for keep-alive / pool
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# Thin CLI
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OAuth 1.0a user-context signing (X-documented path for POST /2/tweets + media)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
form_urlencoded = "1"
url = "2"

# Errors / time / media
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
mime_guess = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
unicode-segmentation = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
